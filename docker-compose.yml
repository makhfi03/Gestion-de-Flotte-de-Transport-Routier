version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: gestion_flotte_db
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: gestion_flotte_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: gestion_flotte_api
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/gestion_flotte
      REDIS_URI: redis://redis:6379
      JWT_ACCESS_SECRET: super_secret_access_token_key_flotte_2026
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: super_secret_refresh_token_key_flotte_2026
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 10
    depends_on:
      - mongodb
      - redis

volumes:
  mongo_data: